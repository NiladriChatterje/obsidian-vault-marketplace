# Runs the payment server and the website together. Both read the repo-root .env.
#   docker compose up --build
#   web: http://localhost:3000   api: http://localhost:4000/health
#
# EXPO_PUBLIC_* are baked into the web bundle at build time (build args below); changing them
# in .env requires `docker compose build web`. Server values are read at runtime.
services:
  api:
    build: ./server
    env_file: .env
    environment:
      API_PORT: 4000
    ports:
      - "4000:4000"
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        EXPO_PUBLIC_SUPABASE_URL: ${EXPO_PUBLIC_SUPABASE_URL:-}
        EXPO_PUBLIC_SUPABASE_ANON_KEY: ${EXPO_PUBLIC_SUPABASE_ANON_KEY:-}
        EXPO_PUBLIC_PLATFORM_COUNTRY: ${EXPO_PUBLIC_PLATFORM_COUNTRY:-IN}
        EXPO_PUBLIC_PLATFORM_FEE_PERCENT_DOMESTIC: ${EXPO_PUBLIC_PLATFORM_FEE_PERCENT_DOMESTIC:-8}
        EXPO_PUBLIC_PLATFORM_FEE_PERCENT_INTERNATIONAL: ${EXPO_PUBLIC_PLATFORM_FEE_PERCENT_INTERNATIONAL:-12}
        EXPO_PUBLIC_PLATFORM_FEE_FIXED_CENTS: ${EXPO_PUBLIC_PLATFORM_FEE_FIXED_CENTS:-4000}
        # The provider's cut, which the minimum listing price is derived from.
        EXPO_PUBLIC_PROVIDER_PERCENT_FEE: ${EXPO_PUBLIC_PROVIDER_PERCENT_FEE:-4}
        EXPO_PUBLIC_PROVIDER_FIXED_FEE_CENTS: ${EXPO_PUBLIC_PROVIDER_FIXED_FEE_CENTS:-3500}
        # Browser-facing URL of the api service (the buyer's browser calls it directly).
        SERVER_API_URL: ${SERVER_API_URL:-http://localhost:4000}
        EXPO_PUBLIC_REDIRECT_ORIGIN: ${EXPO_PUBLIC_REDIRECT_ORIGIN:-http://localhost:3000}
        EXPO_PUBLIC_CATALOG_SOURCE: ${EXPO_PUBLIC_CATALOG_SOURCE:-sanity}
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
