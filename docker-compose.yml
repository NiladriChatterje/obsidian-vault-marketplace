# Runs the payment server and the website together. Both read the repo-root .env.
#   docker compose up --build
#   web: http://localhost:3000   api: http://localhost:4000/health
#   minio consoles: scan buffer http://localhost:9001, vault store http://localhost:9002
#
# The two MinIOs and redis are local containers, so their credentials are written here as
# plain dev values rather than read from .env; nothing outside this network can reach them.
# The listings table lives in Supabase: apply supabase/migrations/0018_catalog_in_postgres.sql
# to the project named in .env before the first `up`, or use docker-compose.dev.yml, which
# points everything at the local Supabase stack (`npx supabase start`) instead.
#
# NEXT_PUBLIC_* are baked into the web bundle at build time (build args below); changing them
# in .env requires `docker compose build web`. Server values are read at runtime.
services:
  api:
    build: ./server
    env_file: .env
    environment:
      API_PORT: 4000
      SCANNER_URL: http://antivirus:8080
      # Queued uploads (server/src/upload-queue.ts): the zip goes browser -> minio, a ticket goes
      # into redis, and the worker below does the scanning and unpacking. The api only writes
      # tickets and answers polls. Leave these three out and it does the whole job inline.
      QUEUE_REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      # How the BROWSER reaches minio; presigned upload links carry this host. Set it in .env when
      # the site is not opened from the machine running compose.
      MINIO_PUBLIC_URL: http://localhost:9000
      MINIO_ACCESS_KEY: vaultmarket
      MINIO_SECRET_KEY: vaultmarket-dev-secret
      # The vault store (server/src/vault-store.ts): note bodies, attachments, covers and the
      # scanned zip, for good. The listings themselves are in Supabase (migration 0018).
      VAULT_STORE_ENDPOINT: http://minio-store:9000
      VAULT_STORE_ACCESS_KEY: vaultstore
      VAULT_STORE_SECRET_KEY: vaultstore-dev-secret
    ports:
      - "4000:4000"
    depends_on:
      - antivirus
      - redis
      - minio
      - minio-store
    restart: unless-stopped

  # The consumer of the upload queue, built from worker/ with the repo root as context (it runs
  # the api's own ingest code out of server/src). No ports: it talks to redis, minio, antivirus
  # and Supabase, and nothing talks to it. Scale it with `docker compose up --scale worker=3`.
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: .env
    environment:
      SCANNER_URL: http://antivirus:8080
      QUEUE_REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: vaultmarket
      MINIO_SECRET_KEY: vaultmarket-dev-secret
      VAULT_STORE_ENDPOINT: http://minio-store:9000
      VAULT_STORE_ACCESS_KEY: vaultstore
      VAULT_STORE_SECRET_KEY: vaultstore-dev-secret
      # Zips one worker holds at once. Each is up to 70 MB in memory and one scanner thread.
      WORKER_CONCURRENCY: "2"
    depends_on:
      antivirus:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_healthy
      minio-store:
        condition: service_healthy
    restart: unless-stopped

  # Where upload tickets wait. Nothing outside this network needs it, so no ports. The volume
  # keeps tickets across a restart so an upload in flight is not forgotten.
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # Where the zip itself waits: an S3-compatible store the browser PUTs to directly. Port 9000 is
  # the S3 API and has to be reachable from the browser (see MINIO_PUBLIC_URL); 9001 is the web
  # console for looking at the bucket. The api creates the bucket and its one-day sweep rule.
  minio:
    # quay.io, not Docker Hub: MinIO stopped publishing there in 2025.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vaultmarket
      MINIO_ROOT_PASSWORD: vaultmarket-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Where vaults live for good: the note bodies, attachments, covers and the scanned zip of every
  # listing (server/src/vault-store.ts). A second MinIO rather than a second bucket in the first
  # so the two can be sized, backed up and, in production, replaced (R2, OCI Object Storage)
  # independently: the one above is a day's scratch, this one is the product. Nothing outside
  # this network needs its S3 port; the console is published for looking at the bucket.
  minio-store:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vaultstore
      MINIO_ROOT_PASSWORD: vaultstore-dev-secret
    ports:
      - "9002:9001"
    volumes:
      - minio-store-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # The vault scanner, built from antivirus/: ClamAV's daemon with a small HTTP front. Every
  # uploaded zip is posted to it before unpacking (server/src/malware.ts), by the api inline or
  # by the worker from the queue, and refused when it cannot get an answer. No ports are
  # published: clamd has no authentication of any kind, so nothing outside this network has any
  # business reaching it.
  # The signature database is baked into the image, so the first start is quick; the volume is
  # what keeps freshclam's daily updates across restarts. Its size limits live in the Dockerfile.
  antivirus:
    build: ./antivirus
    volumes:
      - clamav-db:/var/lib/clamav
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_PLATFORM_COUNTRY: ${NEXT_PUBLIC_PLATFORM_COUNTRY:-IN}
        NEXT_PUBLIC_PLATFORM_FEE_PERCENT_DOMESTIC: ${NEXT_PUBLIC_PLATFORM_FEE_PERCENT_DOMESTIC:-8}
        NEXT_PUBLIC_PLATFORM_FEE_PERCENT_INTERNATIONAL: ${NEXT_PUBLIC_PLATFORM_FEE_PERCENT_INTERNATIONAL:-12}
        NEXT_PUBLIC_PLATFORM_FEE_FIXED_CENTS: ${NEXT_PUBLIC_PLATFORM_FEE_FIXED_CENTS:-4000}
        # The provider's cut, which the minimum listing price is derived from.
        NEXT_PUBLIC_PROVIDER_PERCENT_FEE: ${NEXT_PUBLIC_PROVIDER_PERCENT_FEE:-4}
        NEXT_PUBLIC_PROVIDER_FIXED_FEE_CENTS: ${NEXT_PUBLIC_PROVIDER_FIXED_FEE_CENTS:-3500}
        # Browser-facing URL of the api service (the buyer's browser calls it directly).
        NEXT_PUBLIC_SERVER_API_URL: ${NEXT_PUBLIC_SERVER_API_URL:-${SERVER_API_URL:-http://localhost:4000}}
        NEXT_PUBLIC_REDIRECT_ORIGIN: ${NEXT_PUBLIC_REDIRECT_ORIGIN:-http://localhost:3000}
        NEXT_PUBLIC_CATALOG_SOURCE: ${NEXT_PUBLIC_CATALOG_SOURCE:-server}
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  clamav-db:
  redis-data:
  minio-data:
  minio-store-data:
