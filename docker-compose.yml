# Runs the payment server and the website together. Both read the repo-root .env.
#   docker compose up --build
#   web: http://localhost:3000   api: http://localhost:4000/health
#
# NEXT_PUBLIC_* are baked into the web bundle at build time (build args below); changing them
# in .env requires `docker compose build web`. Server values are read at runtime.
services:
  api:
    build: ./server
    env_file: .env
    environment:
      API_PORT: 4000
      CLAMAV_HOST: clamav
    ports:
      - "4000:4000"
    depends_on:
      - clamav
    restart: unless-stopped

  # Scans every uploaded vault zip before it is unpacked into Sanity (server/src/malware.ts).
  # The first start downloads the signature database, which takes a few minutes and is what the
  # volume keeps; freshclam refreshes it in the background afterwards. Uploads are refused with
  # a 503 until it answers, so the marketplace serves normally while it warms up.
  # The three limits are pinned rather than raised: 1.4 already defaults to exactly these, but
  # its own clamd.conf.sample still documents StreamMaxLength as 25M, well under a 70 MB vault,
  # and a scan that silently refuses the largest uploads is not something to leave to a default.
  # StreamMaxLength is what one upload may be, MaxFileSize covers the archive and its largest
  # member, and MaxScanSize is the total it will decompress before it gives up on a zip bomb.
  clamav:
    image: clamav/clamav:1.4
    environment:
      CLAMD_CONF_StreamMaxLength: 100M
      CLAMD_CONF_MaxFileSize: 100M
      CLAMD_CONF_MaxScanSize: 400M
    volumes:
      - clamav-db:/var/lib/clamav
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_PLATFORM_COUNTRY: ${NEXT_PUBLIC_PLATFORM_COUNTRY:-IN}
        NEXT_PUBLIC_PLATFORM_FEE_PERCENT_DOMESTIC: ${NEXT_PUBLIC_PLATFORM_FEE_PERCENT_DOMESTIC:-8}
        NEXT_PUBLIC_PLATFORM_FEE_PERCENT_INTERNATIONAL: ${NEXT_PUBLIC_PLATFORM_FEE_PERCENT_INTERNATIONAL:-12}
        NEXT_PUBLIC_PLATFORM_FEE_FIXED_CENTS: ${NEXT_PUBLIC_PLATFORM_FEE_FIXED_CENTS:-4000}
        # The provider's cut, which the minimum listing price is derived from.
        NEXT_PUBLIC_PROVIDER_PERCENT_FEE: ${NEXT_PUBLIC_PROVIDER_PERCENT_FEE:-4}
        NEXT_PUBLIC_PROVIDER_FIXED_FEE_CENTS: ${NEXT_PUBLIC_PROVIDER_FIXED_FEE_CENTS:-3500}
        # Browser-facing URL of the api service (the buyer's browser calls it directly).
        NEXT_PUBLIC_SERVER_API_URL: ${NEXT_PUBLIC_SERVER_API_URL:-${SERVER_API_URL:-http://localhost:4000}}
        NEXT_PUBLIC_REDIRECT_ORIGIN: ${NEXT_PUBLIC_REDIRECT_ORIGIN:-http://localhost:3000}
        NEXT_PUBLIC_CATALOG_SOURCE: ${NEXT_PUBLIC_CATALOG_SOURCE:-sanity}
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  clamav-db:
